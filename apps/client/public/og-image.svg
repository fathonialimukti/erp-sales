<!-- B2B CRM OG image source — canonical og:image is og-image.png (1200x630) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter Variable, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#f2f8fc"/>

  <!-- kicker chip -->
  <rect x="96" y="118" width="196" height="42" rx="21" fill="#0069a6" fill-opacity="0.1" stroke="#0069a6" stroke-opacity="0.2"/>
  <text x="194" y="145" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#0069a6">FIELD SALES CRM</text>

  <!-- lockup -->
  <g transform="translate(96 210) scale(2)">
    <rect width="64" height="64" fill="#0069a6"/>
    <g transform="rotate(-9 25 32)"><rect x="11" y="15" width="28" height="34" rx="9" fill="#ffffff"/></g>
    <g transform="rotate(9 39 32)"><rect x="25" y="15" width="28" height="34" rx="9" fill="#ef9900"/></g>
    <circle cx="32" cy="32" r="6.5" fill="#0069a6" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <text x="252" y="300" font-size="76" font-weight="800" letter-spacing="-2.3" fill="#080d16">B2B CRM</text>

  <!-- tagline + descriptor -->
  <text x="96" y="392" font-size="30" font-weight="600" fill="#0069a6">Field sales, boardroom-ready.</text>
  <text x="96" y="440" font-size="21" font-weight="500" fill="#003b67">Customers, outlets, sales orders, visits, and approvals —</text>
  <text x="96" y="472" font-size="21" font-weight="500" fill="#003b67">one designed system for field teams and back-office.</text>

  <!-- KPI card -->
  <rect x="764" y="115" width="340" height="400" rx="16" fill="#fefdfe" stroke="#d6dfe7"/>
  <text x="792" y="167" font-size="14" font-weight="700" letter-spacing="0.8" fill="#003b67">TODAY</text>
  <text x="792" y="226" font-size="14" font-weight="600" fill="#003b67">Sales orders</text>
  <text x="792" y="262" font-size="34" font-weight="800" fill="#080d16">1,284</text>
  <text x="1030" y="262" font-size="15" font-weight="700" fill="#00a859">+12.4%</text>
  <text x="792" y="316" font-size="14" font-weight="600" fill="#003b67">Outlet visits</text>
  <text x="792" y="352" font-size="34" font-weight="800" fill="#080d16">962</text>
  <text x="1040" y="352" font-size="15" font-weight="700" fill="#00a859">+8.1%</text>
  <text x="792" y="406" font-size="14" font-weight="600" fill="#003b67">Approvals</text>
  <text x="792" y="442" font-size="34" font-weight="800" fill="#080d16">318</text>
  <text x="1040" y="442" font-size="15" font-weight="700" fill="#00a859">+5.6%</text>
</svg>