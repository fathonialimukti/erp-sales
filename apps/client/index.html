<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Seed <html lang> from the persisted locale before first paint (WCAG
         3.1.1/3.1.2); App.tsx keeps it in sync at runtime. The cookie name is
         LOCALE_COOKIE_NAME in src/lib/locale.ts. -->
    <script>
      document.documentElement.lang = document.cookie.includes("app-locale=id")
        ? "id"
        : "en";
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <meta name="description" content="B2B CRM — Sales management platform for field teams and back-office. Manage customers, outlets, sales orders, visits, approvals, and real-time insights in one platform." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0069a6" />
    <meta name="application-name" content="B2B CRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Canonical -->
    <link rel="canonical" href="https://erp-sales.app/" />

    <!-- Hreflang -->
    <link rel="alternate" hreflang="en" href="https://erp-sales.app/" />
    <link rel="alternate" hreflang="id" href="https://erp-sales.app/id" />
    <link rel="alternate" hreflang="x-default" href="https://erp-sales.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="B2B CRM — Sales Management Platform" />
    <meta property="og:description" content="One platform to manage customers, outlets, sales orders, visits, and approvals — built for field teams and back-office alike." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="B2B CRM" />
    <meta property="og:url" content="https://erp-sales.app" />
    <meta property="og:image" content="https://erp-sales.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="id_ID" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="B2B CRM — Sales Management Platform" />
    <meta name="twitter:description" content="One platform to manage customers, outlets, sales orders, visits, and approvals — built for field teams and back-office alike." />
    <meta name="twitter:image" content="https://erp-sales.app/og-image.png" />
    <meta name="twitter:site" content="@erpsales" />

    <title>B2B CRM — Sales Management Platform</title>

    <!-- Fonts: preconnect + swap display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preconnect for API. %VITE_TRPC_URL% is substituted at build time by Vite.
         Set in devcontainer; in bare local dev without the env var the token may
         render literally, which is a no-op preconnect and does not break runtime. -->
    <link rel="preconnect" href="%VITE_TRPC_URL%" />
    <link rel="dns-prefetch" href="%VITE_TRPC_URL%" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
