<!-- B2B CRM brand mark, "Twin Cards": two cards crossed in a stack, each carrying a B.
Original twin-card geometry. The letterforms are Inter ExtraBold (wght 800) outlines,
converted to paths and baked in, so the artwork needs no font at render time —
the favicon is loaded by browsers as an SVG image, where webfonts cannot resolve.
Inter is licensed under SIL OFL 1.1. Solid Aurora Azure (primary token oklch(0.5 0.13
242.749) = #0069a6) with the second card Amber (warning token oklch(0.75 0.18 75)
= #ef9900). No gradients. Single-colour variant, inherits currentColor. -->
